# Shared build toolchain for all de.charlex Kotlin Multiplatform libraries.
# Published as de.charlex.conventions.kmp:catalog at the same version as the
# plugins, so a consumer can never combine a catalog and a plugin build that were
# compiled against different AGP/Kotlin APIs.
#
# Library dependencies of a single project do NOT belong here -- those stay in
# the consuming repository's own libs.versions.toml.

[versions]

compileSdk = "37"
minSdk = "23"

# JDK for the Gradle Java toolchain. AGP and Kotlin derive their bytecode
# target from it, so this is the single place the Java level is set.
jdk = "17"
# https://developer.android.com/build/releases/gradle-plugin#compatibility
agp = "9.4.0"

#https://kotlinlang.org/docs/multiplatform-compatibility-guide.html
kotlin = "2.4.10"

dokka = "2.2.0"
nexus-publish-plugin = "2.0.0"

[libraries]

# Needed to compile the convention plugins against the Gradle plugin APIs.
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
nexusPublish-gradlePlugin = { module = "io.github.gradle-nexus:publish-plugin", version.ref = "nexus-publish-plugin" }
dokka-gradlePlugin = { module = "org.jetbrains.dokka:org.jetbrains.dokka.gradle.plugin", version.ref = "dokka" }

[plugins]

android-library = { id = "com.android.library", version.ref = "agp" }
kmp = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# Ships with the Kotlin distribution and is always on the Kotlin version, so it
# belongs next to `kotlin` -- unlike the Compose Multiplatform framework itself,
# which is a per-project choice.
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
nexusPublish = { id = "io.github.gradle-nexus.publish-plugin", version.ref = "nexus-publish-plugin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
